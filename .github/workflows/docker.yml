# Build both service images and smoke-test the full compose stack.
# Blueprint 7.3: end-to-end via compose runs on main (and on demand), not on every branch push.
name: docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-smoke:
    name: build images, compose up, /health + /ready + /v1/capabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # The images (torch CPU in vision + diagnosis) plus the Neo4j / Postgres pulls fill the
      # runner's ~14 GB free disk ("no space left on device" on compose up). Free preinstalled
      # toolchains we never use; plain shell, no third-party action.
      - name: Free runner disk space
        run: |
          echo "::group::disk before"; df -h /; echo "::endgroup::"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          echo "::group::disk after"; df -h /; echo "::endgroup::"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Throwaway .env (random secrets, never uploaded)
        run: |
          cp .env.example .env
          sed -i "s/^IQS_DATABASE__PASSWORD=$/IQS_DATABASE__PASSWORD=$(openssl rand -hex 16)/" .env
          sed -i "s/^IQS_NEO4J__PASSWORD=$/IQS_NEO4J__PASSWORD=$(openssl rand -hex 16)/" .env
          sed -i "s/^IQS_API__KEYS=$/IQS_API__KEYS=$(openssl rand -hex 24)/" .env
      - name: Build images
        run: make build
      # The uv cache mounts and intermediate layers are not needed once the images exist.
      - name: Prune build cache
        run: |
          docker builder prune -af
          df -h /
      - name: Start core + apps and wait until healthy
        run: make up PROFILES=apps
      - name: Smoke test
        run: scripts/smoke_test.sh
      - name: Logs on failure
        if: failure()
        run: make -s logs-once
      - name: Stop
        if: always()
        run: make down

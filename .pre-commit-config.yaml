# All hooks are local and run tools from the uv environment, so versions come from
# uv.lock (same as CI) and pre-commit downloads nothing.
#   install once:   uv run pre-commit install
#   run manually:   make pre-commit
default_install_hook_types: [pre-commit]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      # --- hygiene (pre-commit-hooks package) ---
      - id: check-added-large-files
        name: block files over 1 MB
        entry: uv run --frozen check-added-large-files --maxkb=1024
        language: system
      - id: check-merge-conflict
        name: merge conflict markers
        entry: uv run --frozen check-merge-conflict
        language: system
        types: [text]
      - id: check-case-conflict
        name: case-insensitive filename clash (Windows)
        entry: uv run --frozen check-case-conflict
        language: system
      - id: check-yaml
        name: valid YAML
        entry: uv run --frozen check-yaml
        language: system
        types: [yaml]
      - id: check-toml
        name: valid TOML
        entry: uv run --frozen check-toml
        language: system
        types: [toml]
      - id: end-of-file-fixer
        name: newline at end of file
        entry: uv run --frozen end-of-file-fixer
        language: system
        types: [text]
      - id: trailing-whitespace
        name: trailing whitespace
        entry: uv run --frozen trailing-whitespace-fixer --markdown-linebreak-ext=md
        language: system
        types: [text]
      - id: detect-private-key
        name: private keys
        entry: uv run --frozen detect-private-key
        language: system
        types: [text]

      # --- secrets ---
      - id: detect-secrets
        name: secret scan (detect-secrets, baseline .secrets.baseline)
        entry: uv run --frozen detect-secrets-hook --baseline .secrets.baseline
        language: system
        # Generated manifests hold SHA-256 hashes (no inline pragma in JSON); their schemas
        # are validated instead: vision split manifests by tests/test_data.py, diagnosis
        # corpus manifests by packages/diagnosis/tests/test_corpus_manifest.py, NHTSA sheet
        # manifests are read and cross-checked by scripts/check_nhtsa_labels.py. Step-7 e2e /
        # demo reports hold hashes and IDs (tests/e2e/test_quality_loop.py, scripts/demo_loop.py).
        exclude: ^(uv\.lock|\.secrets\.baseline|eval_sets/vision/[a-z0-9_]+/[a-z0-9_]+\.json|eval_sets/diagnosis/sim/[a-z0-9_]+\.json|eval_sets/diagnosis/nhtsa/[a-z0-9_]+\.manifest\.json|reports/quality_loop/(e2e|demo_[a-z_]+)_[0-9]{8}T[0-9]{6}Z\.json)$

      # --- lockfile ---
      - id: uv-lock-check
        name: uv.lock matches pyproject files
        entry: uv lock --check
        language: system
        files: (^|/)(pyproject\.toml|uv\.lock)$
        pass_filenames: false

      # --- Python ---
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy (whole project, config in pyproject.toml)
        entry: uv run --frozen mypy
        language: system
        types_or: [python, pyi, toml]
        pass_filenames: false

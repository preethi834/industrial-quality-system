# Image-to-part linkage for the integration demo (step 7, iqs_sim.linker).
# SYNTHETIC LINKAGE: the images carry no process data; this file decides which kind of
# image a simulated part "shows" at inspection. It is a modelling choice, not plant data.
#
# fault_to_defect: surface-defect fault -> defect folder under <pool>/<category>/<defect_dir>.
#   Dimension-only faults (fixture_offset, handling_error_on_shift,
#   sensor_calibration_drift) cause no visible defect and are rejected.
# background_defect: defect type shown for surface defects with no mapped fault (the line's
#   base defect rate). null = such parts are shown as good images (manifest: shown_as=good).
version: 1
seed: 0
categories:
  # iqs_vision.testing.make_mvtec_like (stripe texture; "spot" and "scratch" defects).
  # Used by the unit and e2e tests. Two deliberate simplifications, so the plumbing test
  # is not confounded by the detector (KNOWN_ISSUES #46):
  # - good parts show the detector's own TRAINING goods (scores below the threshold by
  #   construction), so false alarms on good parts cannot form a cluster;
  # - background surface defects (no fault) are shown as good images.
  toy:
    good_dir: train/good
    defect_dir: test/{defect_type}
    fault_to_defect:
      accelerated_tool_wear: scratch
    background_defect: null
  # MVTec AD metal_nut (defects: bent, color, flip, scratch). Used by scripts/demo_loop.py
  # with real images (read-only data/ symlink, owner approval).
  # Good parts show the 66 good images the deploy detector never trained on: the step-2
  # split's calib goods (train/good, held out from fit; they set the conformal threshold)
  # plus test/good. Checked against eval_sets/vision/mvtec_ad/metal_nut.json by
  # tests/test_image_linkage_config.py. Dealt without replacement (KNOWN_ISSUES #46).
  metal_nut:
    sampling: without_replacement
    good_images:
      - test/good/000.png
      - test/good/001.png
      - test/good/002.png
      - test/good/003.png
      - test/good/004.png
      - test/good/005.png
      - test/good/006.png
      - test/good/007.png

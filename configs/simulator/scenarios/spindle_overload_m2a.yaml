name: spindle_overload_m2a
description: >-
  Spindle load on M2A 1.5 times normal from hour 24 at correct setpoints.
seed: 7
start: "2026-01-05T06:00:00Z"
duration_hours: 72
faults:
  - type: spindle_overload
    target: M2A
    magnitude: 1.5
    onset_hours: 24

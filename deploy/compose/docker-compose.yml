# Local infrastructure. Always run through the Makefile (make up / make down), which calls
#   docker compose --project-directory . -f deploy/compose/docker-compose.yml
# from the repository root, so the repo-root .env is used for ${...} interpolation
# and relative paths below are relative to the repository root.
#
# Single source for credentials: POSTGRES_* and NEO4J_AUTH are built from the same
# IQS_* variables the Python services read. Only variables named under `environment`
# reach a container; .env itself is not injected.
#
# Profiles: core = Postgres + Neo4j. apps = core + the vision and diagnosis APIs (+ dashboard).
# vision = Postgres + vision API (+ dashboard): the step-1 demo without Neo4j (ADR-004).
# llm / observability are added in later steps.
# Host ports can be moved with IQS_*_HOST_PORT (defaults below); the e2e stack uses that.

name: iqs

services:
  postgres:
    # pgvector 0.8.7 on PostgreSQL 16 (Debian bookworm), pinned by digest.
    image: pgvector/pgvector:0.8.7-pg16-bookworm@sha256:484e838076e04939d27d3e176e91c86eea96236126023be8d3059761122e579f
    profiles: [core, apps, vision]
    environment:
      POSTGRES_DB: ${IQS_DATABASE__NAME:?set IQS_DATABASE__NAME in .env}
      POSTGRES_USER: ${IQS_DATABASE__USER:?set IQS_DATABASE__USER in .env}
      POSTGRES_PASSWORD: ${IQS_DATABASE__PASSWORD:?set IQS_DATABASE__PASSWORD in .env}
    ports:
      - "127.0.0.1:${IQS_DATABASE__PORT:?set IQS_DATABASE__PORT in .env}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./deploy/compose/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 1g
    restart: unless-stopped

  neo4j:
    # Neo4j 5.26 LTS, community edition, pinned by digest.
    image: neo4j:5.26.33-community@sha256:577eb43120e8688e62e753e962c47d30044ecaa95147ee5386c29f226b878008
    profiles: [core, apps]
    environment:
      # Neo4j only accepts the user "neo4j" here; the password needs 8+ characters.
      NEO4J_AUTH: ${IQS_NEO4J__USER:?set IQS_NEO4J__USER in .env}/${IQS_NEO4J__PASSWORD:?set IQS_NEO4J__PASSWORD in .env}
      # Memory caps sized for a 10 GB WSL VM (blueprint: Neo4j heap is capped in config).
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "127.0.0.1:${IQS_NEO4J_HTTP_HOST_PORT:-7474}:7474"  # browser / HTTP
      - "127.0.0.1:${IQS_NEO4J_BOLT_HOST_PORT:-7687}:7687"  # bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test:
        - CMD-SHELL
        - cypher-shell -u "$${NEO4J_AUTH%%/*}" -p "$${NEO4J_AUTH#*/}" 'RETURN 1' > /dev/null
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    mem_limit: 2g
    restart: unless-stopped

  vision:
    build:
      context: .
      dockerfile: deploy/docker/vision.Dockerfile
    image: iqs-vision:dev
    profiles: [apps, vision]
    environment: &service-env
      IQS_ENVIRONMENT: ${IQS_ENVIRONMENT:-dev}
      IQS_LOGGING__LEVEL: ${IQS_LOGGING__LEVEL:-INFO}
      IQS_DATABASE__HOST: postgres
      IQS_DATABASE__PORT: "5432"
      IQS_DATABASE__NAME: ${IQS_DATABASE__NAME:?set IQS_DATABASE__NAME in .env}
      IQS_DATABASE__USER: ${IQS_DATABASE__USER:?set IQS_DATABASE__USER in .env}
      IQS_DATABASE__PASSWORD: ${IQS_DATABASE__PASSWORD:?set IQS_DATABASE__PASSWORD in .env}
      IQS_API__KEYS: ${IQS_API__KEYS:?set IQS_API__KEYS in .env}
      IQS_VISION__PROTOCOL: ${IQS_VISION__PROTOCOL:-deploy}
    volumes:
      # Trained detectors (models/patchcore) and backbone weights (models/weights),
      # read-only; the image never downloads anything (blueprint Rev 2 §3.9).
      - ./models:/app/models:ro
    ports:
      - "127.0.0.1:${IQS_VISION_HOST_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy
    # WideResNet-50 backbone + up to two cached memory banks (estimate; see TESTING.md).
    mem_limit: 2g
    restart: unless-stopped

  diagnosis:
    build:
      context: .
      dockerfile: deploy/docker/diagnosis.Dockerfile
    image: iqs-diagnosis:dev
    profiles: [apps]
    environment:
      <<: *service-env
      IQS_NEO4J__URI: bolt://neo4j:7687
      IQS_NEO4J__USER: ${IQS_NEO4J__USER:?set IQS_NEO4J__USER in .env}
      IQS_NEO4J__PASSWORD: ${IQS_NEO4J__PASSWORD:?set IQS_NEO4J__PASSWORD in .env}
    ports:
      - "127.0.0.1:${IQS_DIAGNOSIS_HOST_PORT:-8002}:8002"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    mem_limit: 1g
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: deploy/docker/dashboard.Dockerfile
    image: iqs-dashboard:dev
    profiles: [apps, vision]
    environment:
      IQS_ENVIRONMENT: ${IQS_ENVIRONMENT:-dev}
      IQS_API__KEYS: ${IQS_API__KEYS:?set IQS_API__KEYS in .env}
      IQS_DASHBOARD__VISION_URL: http://vision:8001
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      vision:
        condition: service_healthy
    mem_limit: 512m
    restart: unless-stopped

volumes:
  pg_data:
  neo4j_data:
  neo4j_logs:


[project]
name = "iqs-common"
version = "0.1.0"
description = "Shared schemas, settings, logging, and database utilities for Industrial Quality AI."
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2",
    "structlog>=24.1",
    "pyyaml>=6.0",
    "alembic>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iqs_common"]


[project]
name = "iqs-diagnosis"
version = "0.1.0"
description = "Active root-cause diagnosis agent for industrial quality management."
requires-python = ">=3.11,<3.12"
dependencies = [
    "iqs-common[api]",
    "iqs-mcp",
    "mcp",
    "langgraph",
    "langgraph-checkpoint-postgres",
    "httpx",
    "neo4j",
    "rank-bm25",
    "sentence-transformers",
    "pgmpy",
    "scipy",
    "statsmodels",
    "duckdb",
    "pandas",
    "pyarrow",
    "fastapi",
    "uvicorn[standard]",
    "torch",
]

[tool.uv.sources]
iqs-common = { workspace = true }
iqs-mcp = { workspace = true }
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iqs_diagnosis"]

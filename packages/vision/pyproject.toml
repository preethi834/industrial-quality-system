
[project]
name = "iqs-vision"
version = "0.1.0"
description = "Industrial visual anomaly detection and open-world defect discovery."
requires-python = ">=3.11,<3.12"
dependencies = [
    "iqs-common[api]",
    "numpy",
    "scikit-learn",
    "scipy",
    "opencv-python-headless",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "mlflow",
    "torch",
    "torchvision",
    "timm",
    "anomalib",
]

[tool.uv.sources]
iqs-common = { workspace = true }
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iqs_vision"]

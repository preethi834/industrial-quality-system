
[project]
name = "industrial-quality-ai"
version = "0.1.0"
description = "An integrated industrial AI engineering platform for defect discovery and root-cause diagnosis."
requires-python = ">=3.11,<3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "testcontainers>=4",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "pre-commit-hooks>=5",
    "detect-secrets>=1.5",
]

[tool.uv]
package = false
# The project runs only in WSL2 and Docker (Linux x86_64). Limiting the lock to
# this platform keeps it smaller and avoids conflicts with macOS or Windows builds.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.workspace]
members = ["packages/*"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["packages/*/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Notebooks: shell (!) lines and Colab-only imports inside cells.
"*.ipynb" = ["E402", "E501"]

[tool.mypy]
python_version = "3.11"
# One command checks every tree: `uv run mypy`.
# Each package's src/ is a module root, so packages/common/src/iqs_common/db.py is the
# module "iqs_common.db" (not "packages.common.src.iqs_common.db", which made mypy report
# "Source file found twice"). Tests, migrations and other dirs keep path-based names.
files = ["packages", "tests", "infrastructure", "scripts"]
mypy_path = [
    "packages/common/src",
    "packages/vision/src",
    "packages/diagnosis/src",
    "packages/mcp_server/src",
    "packages/simulator/src",
    "packages/dashboard/src",
]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests", "packages/*/tests"]
python_files = ["test_*.py"]
# Integration and e2e tests need Docker; they are skipped by default.
# Run: make test-integration / make test-e2e
# (a later -m on the command line overrides the one here).
addopts = "--import-mode=importlib -m 'not integration and not e2e'"
markers = [
    "integration: needs Docker (testcontainers Postgres / Neo4j)",
    "e2e: needs Docker and the built images; starts its own compose project iqs-e2e (make test-e2e)",
]

[tool.coverage.run]
# Measure our packages only (not tests, not the venv).
source_pkgs = ["iqs_common", "iqs_vision", "iqs_diagnosis", "iqs_mcp", "iqs_sim", "iqs_dashboard"]
branch = true

[tool.coverage.report]
skip_empty = true

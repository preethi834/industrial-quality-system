
[project]
name = "industrial-quality-ai"
version = "0.1.0"
description = "An integrated industrial AI engineering platform for defect discovery and root-cause diagnosis."
requires-python = ">=3.11,<3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "testcontainers>=4",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
]

[tool.uv]
package = false
# The project runs only in WSL2 and Docker (Linux x86_64). Limiting the lock to
# this platform keeps it smaller and avoids conflicts with macOS or Windows builds.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.workspace]
members = ["packages/*"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["packages/*/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests", "packages/*/tests"]
python_files = ["test_*.py"]
addopts = "--import-mode=importlib"
